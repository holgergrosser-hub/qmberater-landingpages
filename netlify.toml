# Netlify-Konfiguration – qmberater-landingpages
#
# Es gibt bewusst KEIN build command: das fertige HTML und die kompilierte
# Tailwind-CSS liegen im Repo unter public/. Netlify veröffentlicht sie direkt.
# Neu gebaut wird lokal mit ./build.sh, das Ergebnis wird committet.

[build]
  publish = "public"

# --------------------------------------------------------------------------
# UMZUG auf qm-guru.de/iso-9001-wissen/
# Reihenfolge beachten: erst muss der Cloudflare-Worker "wissen-proxy" laufen,
# DANN diesen Commit veroeffentlichen. Sonst leitet die Subdomain auf eine 404.
# --------------------------------------------------------------------------

# 1) Alte Subdomain dauerhaft auf die neue URL, Pfad bleibt erhalten
[[redirects]]
  from = "https://landing.qmberater.info/*"
  to = "https://qm-guru.de/iso-9001-wissen/:splat"
  status = 301
  force = true

# 2) Prefix-Toleranz: falls doch einmal ein Aufruf MIT Prefix bei Netlify
#    ankommt, wird er trotzdem korrekt bedient
[[redirects]]
  from = "/iso-9001-wissen/*"
  to = "/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
