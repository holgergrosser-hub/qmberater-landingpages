[build]
  publish = "public"

# XML und TXT Dateien richtig ausliefern
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Redirect-Regeln
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
